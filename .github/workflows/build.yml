name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build OPIPP.slnx -c Release --nologo

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          dotnet test OPIPP.slnx -c Release --no-build --nologo | tee test.log
          total=$(grep -oE "Passed: +[0-9]+" test.log | awk '{sum += $2} END {print sum}')
          echo "count=$total" >> "$GITHUB_OUTPUT"

      - name: Docs consistency
        shell: bash
        env:
          TEST_COUNT: ${{ steps.test.outputs.count }}
        run: ./tools/check-docs.sh

      # The parity harness is intentionally not run here: it needs the original PIPP binaries,
      # which are not redistributable and are not part of this repository. Parity is verified
      # locally against bin/pipp_core.exe; see docs/parity.md.
